[package]
name = "imgopt-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["parallel", "webp", "avif"]
parallel = ["imgopt-codecs/parallel"]
webp = ["imgopt-codecs/webp"]
avif = ["avif-encode", "avif-decode"]
avif-encode = ["imgopt-codecs/avif-encode"]
avif-decode = ["imgopt-codecs/avif-decode"]

[dependencies]
globset = { workspace = true }
hex = { workspace = true }
imgopt-codecs = { path = "../imgopt-codecs", default-features = false }
imgopt-quality = { path = "../imgopt-quality" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
