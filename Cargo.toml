[workspace]
resolver = "2"
members = [
    "crates/imgopt-cli",
    "crates/imgopt-codecs",
    "crates/imgopt-core",
    "crates/imgopt-manifest",
    "crates/imgopt-quality",
    "crates/imgopt-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.17"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
url = "2.5"
webp = "0.3"
